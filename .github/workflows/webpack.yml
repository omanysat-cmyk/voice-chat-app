name: Mobile APK Auto Build

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Convert Web To Android Framework
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Voice Chat App" "com.voicechat.app" --web-dir=dist
          npx vite build
          npx cap add android
          npx cap sync android

      - name: Compile Gradle Release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Share APK File
        uses: actions/upload-artifact@v4 
        with:
          name: Voice-Chat-App-Mobile
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
