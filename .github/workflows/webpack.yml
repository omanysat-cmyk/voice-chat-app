name: Mobile APK Auto Build 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 👈 تحديث تلقائي للإصدار الأحدث

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4 # 👈 تحديث تلقائي للإصدار الأحدث
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 👈 تحديث تلقائي للإصدار الأحدث
        with:
          node-version: '18'

      # تحويل مشروع الويب الخاص بك إلى أندرويد
      - name: Convert Web To Android Framework
        run: |
          cd voice-chat-app-main/frontend
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Voice Chat App" "com.voicechat.app" --web-dir=dist
          npm run build
          npx cap add android
          npx cap sync android

      # بناء ملف الـ APK النهائي
      - name: Compile Gradle Release APK
        run: |
          cd voice-chat-app-main/frontend/android
          ./gradlew assembleRelease

      # 🔥 هنا قمنا بحل المشكلة وتحديث الأداة إلى v4 المتوافقة مع تحديثات GitHub الحالية
      - name: Share APK File
        uses: actions/upload-artifact@v4 
        with:
          name: Voice-Chat-App-Mobile
          path: voice-chat-app-main/frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
