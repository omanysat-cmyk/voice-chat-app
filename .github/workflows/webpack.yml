name: Mobile APK Auto Build

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Fix Config Files Format
        run: |
          cd frontend
          [ -f postcss.config.js ] && mv postcss.config.js postcss.config.cjs || true
          [ -f tailwind.config.js ] && mv tailwind.config.js tailwind.config.cjs || true

      - name: Build Web Application with Vite
        run: |
          cd frontend
          export TSC_COMPILE_ON_ERROR=true
          npx vite build --emptyOutDir

      - name: Initialize Capacitor
        run: |
          cd frontend
          if [ ! -f capacitor.config.ts ]; then
            npx cap init "Voice Chat App" "com.voicechat.app" --web-dir=dist
          fi

      - name: Add Android Platform
        run: |
          cd frontend
          npx cap add android || npx cap sync android

      - name: Sync Capacitor with Android
        run: |
          cd frontend
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-version: '34'

      - name: Build Release APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace --info

      - name: Verify APK Output
        run: |
          echo "=== Checking APK Files ==="
          find frontend/android/app/build/outputs -name "*.apk" -type f
          ls -lah frontend/android/app/build/outputs/apk/release/ || echo "Warning: Release directory not found"

      - name: Upload APK to Artifacts
        if: success()
        uses: actions/upload-artifact@v4 
        with:
          name: Voice-Chat-App-Mobile
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs-Debug
          path: |
            frontend/android/build/
            frontend/android/app/build/
          retention-days: 7
