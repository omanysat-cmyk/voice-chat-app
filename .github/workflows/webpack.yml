name: Mobile APK Auto Build

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Convert Web To Android Framework
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Voice Chat App" "com.voicechat.app" --web-dir=dist
          
          # Fix Module Error by renaming config files to CommonJS format
          [ -f postcss.config.js ] && mv postcss.config.js postcss.config.cjs || true
          [ -f tailwind.config.js ] && mv tailwind.config.js tailwind.config.cjs || true
          
          export TSC_COMPILE_ON_ERROR=true
          npx vite build --emptyOutDir || true
          
          mkdir -p dist
          npx cap add android || true
          npx cap sync android

      - name: Compile Gradle Release APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Share APK File
        uses: actions/upload-artifact@v4 
        with:
          name: Voice-Chat-App-Mobile
          path: frontend/android/app/build/outputs/apk/release/
