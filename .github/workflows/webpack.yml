name: Mobile APK Auto Build 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من الهاتف في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 🔥 هنا السيرفر يقوم بتحويل مشروع الويب الخاص بك إلى أندرويد تلقائياً
      - name: Convert Web To Android Framework
        run: |
          cd voice-chat-app-main/frontend
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Voice Chat App" "com.voicechat.app" --web-dir=dist
          npm run build
          npx cap add android
          npx cap sync android

      # بناء ملف الـ APK النهائي
      - name: Compile Gradle Release APK
        run: |
          cd voice-chat-app-main/frontend/android
          ./gradlew assembleRelease

      # رفع ملف الـ APK لتنزيله على هاتفك مباشرة
      - name: Share APK File
        uses: actions/upload-artifact@v3
        with:
          name: Voice-Chat-App-Mobile
          path: voice-chat-app-main/frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
